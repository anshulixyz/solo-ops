<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../icons/icon.svg?v=mono" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png?v=mono">
<meta name="theme-color" content="#222222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solo Ops">
<title>Video — Solo Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="../solo.config.js"></script>
<script src="../core/theme-boot.js"></script>
<link rel="stylesheet" href="script-viewer.css">
<link rel="stylesheet" href="video.css">
<link rel="stylesheet" href="../core/theme.css">
<link rel="stylesheet" href="../core/ui.css">
</head>
<body>
<div class="app video-app">
  <nav data-nav data-root="../" class="studio-nav"></nav>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow"><span data-cfg="name"></span> · Studio</span>
      <h1><span data-cfg="studio.videoTitle" data-cfg-title="studio.videoTitle">Video</span><span class="dot">.</span></h1>
    </div>
    <div class="toolbar">
      <button class="btn" id="cutWithAiBtn" title="Opens the Guide on “Cut this take”: your agent reads the words, proposes the cut, and after your yes the cut lands here" onclick="cutWithAI()">Cut it with my AI</button>
      <details class="menu" id="moreMenu"><summary>More</summary>
        <div onclick="document.getElementById('moreMenu').removeAttribute('open')">
          <div class="hint">This take</div>
          <button class="btn" onclick="copyForAI()" title="The words with their times and how to answer, for any chat">Copy for AI</button>
          <button class="btn" onclick="copyLine('show')" title="node solo.js video show …">Copy the terminal line</button>
          <button class="btn" onclick="copyLine('folder')" title="Where the words and renders live">Copy the folder path</button>
          <div class="sep"></div>
          <div class="hint">Settings</div>
          <button class="btn" onclick="showKeyCard()" title="Paste a new ElevenLabs key; it stays on this computer">ElevenLabs key…</button>
          <div class="sep"></div>
          <button class="btn" onclick="removeTake()">Remove this take</button>
        </div></details>
      <span data-sync-pill></span>
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M22 12h-2.5M4.5 12H2M19 5l-1.8 1.8M6.8 17.2 5 19M19 19l-1.8-1.8M6.8 6.8 5 5"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace video-workspace" id="workspace">
    <aside class="notes-sidebar" aria-label="Your takes">
      <div class="notes-head">
        <span class="notes-head-label">Takes</span>
        <button type="button" class="btn primary notes-new-btn" title="Add a take" onclick="openAdd()">+</button>
      </div>
      <div class="notes-list" id="takesList"></div>
      <div class="notes-foot">
        <button type="button" class="btn ghost" onclick="openAdd()">Add a take</button>
        <button type="button" class="btn ghost" onclick="removeTake()">Remove</button>
      </div>
    </aside>
    <div class="video-main" id="pane">
      <div class="v-top" id="top">
        <div id="strip"></div>
        <div id="review"></div>
        <div class="v-pr" id="playerRow" style="display:none"><div class="v-pwrap"><video id="player" playsinline preload="metadata"></video><div class="v-caption" id="captionBox" style="display:none"><span id="caption"></span></div></div><div class="v-pside" id="playerSide"></div></div>
        <div id="playerCap"></div>
      </div>
      <main id="main"></main>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".srt,.vtt,.json" style="display:none" onchange="importChosen(this)">
<div class="toast" id="toast"></div>

<script src="../core/store.js"></script>
<script src="../core/config.js"></script>
<script src="../core/story.js"></script>
<script src="../core/templates.js"></script>
<script src="../core/prompts.js"></script>
<script src="../core/when.js"></script>
<script src="../core/theme.js"></script>
<script src="../core/sync.js"></script>
<script src="../core/activity.js"></script>
<script src="../core/recent.js"></script>
<script src="../core/palette.js"></script>
<script src="../core/attach.js"></script>
<script src="../inspo/inspo-model.js"></script>
<script src="../core/inspo-quick.js"></script>
<script src="../core/video.js"></script>
<script src="../core/apply.js"></script>
<script src="../core/context.js"></script>
<script src="../core/quick.js"></script>
<script src="../core/guide.js"></script>
<script src="../core/nav.js"></script>
<script src="video-model.js"></script>
<script src="video-view.js"></script>
<script src="video-main.js"></script>
</body>
</html>
