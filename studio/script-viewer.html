<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#CC6B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solo Ops">
<title>Script Viewer — Solo Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="../solo.config.js"></script>
<script src="../core/theme-boot.js"></script>
<link rel="stylesheet" href="script-viewer.css">
<link rel="stylesheet" href="../core/theme.css">
<link rel="stylesheet" href="../core/ui.css">
</head>
<body>
<div class="app">
  <nav data-nav data-root="../" class="studio-nav"></nav>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow"><span data-cfg="name"></span> · Studio</span>
      <h1><span data-cfg="studio.scriptTitle" data-cfg-title="studio.scriptTitle">Script Viewer</span><span class="dot">.</span></h1>
    </div>
    <div class="toolbar">
      <div class="view-tabs">
        <button class="view-tab active" data-view="script">Script</button>
        <button class="view-tab" data-view="reader">Reader</button>
        <button class="view-tab" data-view="phone">9:16</button>
      </div>
      <div class="size-control">
        <span>Aa</span>
        <input type="range" id="fontScale" min="0.7" max="1.6" step="0.05" value="1" title="Font size">
      </div>
      <button class="btn primary" id="teleprompterBtn">Teleprompter</button>
      <button class="btn" id="copyScriptBtn" title="Copy the raw script — paste into your agent chat">Copy for AI</button>
      <details class="menu" id="moreMenu"><summary>More</summary>
        <div onclick="document.getElementById('moreMenu').removeAttribute('open')">
          <div class="hint">This script</div>
          <button class="btn" id="loadExample" title="Add the example script">Add the example script</button>
          <button class="btn" onclick="window.print()" title="Print script">Print</button>
        </div></details>
      <span data-sync-pill></span>
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M22 12h-2.5M4.5 12H2M19 5l-1.8 1.8M6.8 17.2 5 19M19 19l-1.8-1.8M6.8 6.8 5 5"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace with-sidebar" id="workspace">
    <aside class="notes-sidebar" aria-label="Your scripts">
      <div class="notes-head">
        <span class="notes-head-label">Scripts</span>
        <button type="button" class="btn primary notes-new-btn" id="newScriptBtn" title="New script">+</button>
      </div>
      <div class="notes-list" id="scriptsList"></div>
      <div class="notes-foot">
        <button type="button" class="btn ghost" id="dupScriptBtn">Duplicate</button>
        <button type="button" class="btn ghost" id="delScriptBtn">Delete</button>
      </div>
    </aside>
    <aside class="editor-pane">
      <div class="editor-head">
        <span>Your script</span>
        <button class="btn ghost" id="clearScript" style="padding:4px 8px;font-size:11px">Clear</button>
      </div>
      <textarea id="scriptInput" placeholder="Paste or type your script here…

Supports:
## Hook — opening line
## Script — numbered beats (1. 2. 3.)
## Inserts — what shows on screen
## Prep — - [ ] checkboxes
Plain text — each paragraph becomes a beat
CHARACTER: dialogue lines
(stage directions in parentheses)" spellcheck="true"></textarea>
    </aside>
    <main class="preview-pane" id="previewPane">
      <div id="preview"></div>
    </main>
  </div>
</div>

<!-- Teleprompter overlay -->
<div class="teleprompter" id="teleprompter">
  <div class="prompter-focus-line"></div>
  <div class="prompter-bar">
    <span style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6">Teleprompter</span>
    <div class="controls">
      <label>Speed <input type="range" id="prompterSpeed" min="10" max="120" value="40"></label>
      <button class="btn" id="prompterPlayBtn">Play</button>
      <button class="btn" id="closePrompter">Exit</button>
    </div>
  </div>
  <div class="prompter-scroll" id="prompterScroll"></div>
</div>

<div class="toast" id="toast"></div>

<script src="../core/store.js"></script>
<script src="../core/config.js"></script>
<script src="../core/templates.js"></script>
<script src="../core/theme.js"></script>
<script src="../core/sync.js"></script>
<script src="../core/activity.js"></script>
<script src="../core/recent.js"></script>
<script src="../core/palette.js"></script>
<script src="../core/attach.js"></script>
<script src="../inspo/inspo-model.js"></script>
<script src="../core/inspo-quick.js"></script>
<script src="../core/apply.js"></script>
<script src="../core/context.js"></script>
<script src="../core/guide.js"></script>
<script src="../core/nav.js"></script>
<script src="script-viewer.js"></script>
</body>
</html>
