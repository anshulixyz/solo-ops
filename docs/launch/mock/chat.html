<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* docs/launch/mock/chat.html?c=<id> — a plain chat window for the launch screenshots.
   Reproduction of what using a chat assistant with Solo Ops looks like: generic
   chrome (no product wordmark or logo is drawn), verbatim content from
   conversations/chats.js. The assistant's name comes from the conversation. */
:root{--bg:#F7F7F5;--panel:#FFFFFF;--ink:#1B1B1A;--muted:#6B6B68;--line:#E6E5E1;--user:#ECEAE4;--code:#1F1F1E;--accent:#2C2C2A;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55}
.win{height:100vh;display:grid;grid-template-columns:260px 1fr;}
.side{background:#F0EFEB;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:13.5px}
.side .new{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:500}
.side .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:12px;color:#9A9994}
.side .item{padding:7px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .item.on{background:var(--panel);color:var(--ink)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;background:var(--bg)}
.top .model{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.scroll{flex:1;min-height:0;overflow:auto;padding:26px 0 0}
.thread{max-width:760px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.bubble{max-width:82%;background:var(--user);border-radius:18px;padding:12px 16px;white-space:pre-wrap}
.msg.assistant .body{flex:1;min-width:0;white-space:pre-wrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;margin-top:2px}
.pasted{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;color:var(--muted)}
.pasted b{color:var(--ink);display:block;margin-bottom:4px;font-weight:600}
.pasted .snip{white-space:pre-wrap;max-height:112px;overflow:hidden;position:relative;color:#55544F;font-size:13px;line-height:1.5}
.pasted .snip::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--panel))}
.pasted .more{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.body p{margin:0 0 10px}
.body strong{font-weight:600}
.body em{font-style:italic}
.body ul{margin:4px 0 10px 20px;padding:0}
.body ol{margin:4px 0 10px 22px;padding:0}
.body li{margin:3px 0}
pre{background:var(--code);color:#F3F2EE;border-radius:12px;padding:14px 16px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.2px;line-height:1.6;overflow:hidden;margin:8px 0 0;white-space:pre-wrap}
pre .lbl{display:block;color:#9C9B95;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.composer{padding:14px 24px 20px}
.composer .box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.composer .send{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.foot{text-align:center;font-size:11.5px;color:#A4A39E;margin-top:8px}
.tool{display:inline-block;font:13px/1.4 ui-monospace,Menlo,monospace;color:#555;background:#f1f0ec;border:1px solid #e2e0da;border-radius:8px;padding:5px 10px;margin:0 6px 10px 0}
</style>
</head>
<body>
<div class="win">
  <aside class="side">
    <div class="new">+ New chat</div>
    <div class="h">Today</div>
    <div class="item on" id="sideTitle"></div>
    <div class="item">Thumbnail options</div>
    <div class="h">Yesterday</div>
    <div class="item">Landing page copy</div>
    <div class="item">Export crash on long clips</div>
    <div class="item">Investor intro prep</div>
  </aside>
  <main class="main">
    <div class="top"><span id="asst"></span><span class="model" id="model"></span></div>
    <div class="scroll"><div class="thread" id="thread"></div></div>
    <div class="composer"><div class="box"><span>Reply…</span><span class="send">↑</span></div><div class="foot">Reproduction for the Solo Ops launch screenshots · content verbatim</div></div>
  </main>
</div>
<script src="../conversations/chats.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('c'); var c = window.CHATS[id]; if (!c) { document.body.textContent = 'unknown conversation: ' + id; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  // light markdown: paragraphs, **bold**, *em*, "- " lists, "1. " lists
  function md(text) {
    var lines = String(text).split('\n'); var out = []; var list = null;
    function inline(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>'); }
    function closeList() { if (list) { out.push('</' + list + '>'); list = null; } }
    lines.forEach(function (l) {
      var m;
      if ((m = l.match(/^- (.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if ((m = l.match(/^\d+\. (.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      closeList(); if (l.trim()) out.push('<p>' + inline(l) + '</p>');
    });
    closeList(); return out.join('');
  }
  document.getElementById('asst').textContent = c.assistant; document.getElementById('model').textContent = c.assistant === 'Claude' ? 'Sonnet' : '';
  document.getElementById('sideTitle').textContent = c.title; document.title = c.title;
  document.getElementById('thread').innerHTML = c.messages.map(function (m) {
    if (m.role === 'user') {
      var pasted = m.pasted ? '<div class="pasted"><b>' + esc(m.pasted) + '</b><div class="snip">' + esc(m.text) + '</div><span class="more">Pasted text · ' + (m.text.length > 400 ? 'with the snapshot of the board' : 'full prompt') + '</span></div>' : '';
      var typed = m.pasted ? (m.text.indexOf('\n---\n') > 0 ? esc(m.text.split('\n---\n')[1]) : '') : esc(m.text);
      return '<div class="msg user"><div class="bubble">' + pasted + typed + '</div></div>';
    }
    var tools = (m.tools || []).map(function (t) { return '<div class="tool">✓ ' + esc(t) + '</div>'; }).join('');
    return '<div class="msg assistant"><div class="av">' + esc(c.assistant.charAt(0)) + '</div><div class="body">' + tools + md(m.text) + (m.code ? '<pre><span class="lbl">Changes for Solo Ops · paste into Guide → Reply</span>' + esc(m.code) + '</pre>' : '') + '</div></div>';
  }).join('');
  var sc = document.querySelector('.scroll'); function bottom() { sc.scrollTop = sc.scrollHeight; } bottom(); window.addEventListener('load', bottom); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(bottom, 50); setTimeout(bottom, 600); });
})();
</script>
</body>
</html>
