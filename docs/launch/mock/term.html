<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal frame</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* docs/launch/mock/term.html?t=<id> — a terminal window for the launch screenshots.
   Content from conversations/terms.js: user lines, the agent's sentences and
   the commands it ran with their REAL stdout (captured by seed.js / by hand on
   a throwaway copy, kept as .txt next to terms.js and loaded here). */
:root{--bg:#121212;--ink:#E9E7E1;--dim:#8E8C86;--green:#9ED0A0;--amber:#E7C98A;--blue:#9DBDE6;--line:#2A2A2A;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2B2B2B;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.win{position:absolute;inset:34px 40px;background:var(--bg);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
.bar{height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;background:#1C1C1C;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.bar i{width:12px;height:12px;border-radius:50%;display:inline-block;background:#444}
.bar i.r{background:#FF5F57}.bar i.y{background:#FEBC2E}.bar i.g{background:#28C840}
.bar .t{margin:0 auto;transform:translateX(-30px)}
.body{flex:1;overflow:hidden;padding:18px 22px;color:var(--ink);font-size:13.4px;line-height:1.62;white-space:pre-wrap}
.u{color:var(--ink)} .u::before{content:'› ';color:var(--amber)}
.u .slash{color:var(--blue)}
.hint{color:var(--dim);font-size:12px;margin-left:2ch}
.a{color:var(--ink);margin:10px 0 4px;display:block} .a::before{content:'⏺ ';color:var(--green)}
.tool{display:block;margin:8px 0 0}
.tool::before{content:'⏺ ';color:var(--green)}
.tool b{font-weight:500;color:var(--ink)} .tool .cmd{color:var(--blue)}
.out{display:block;color:var(--dim);margin:0 0 2px 2ch;border-left:1px solid var(--line);padding-left:12px;white-space:pre-wrap}
.out .ok{color:var(--green)} .out .warn{color:var(--amber)} .out .h{color:var(--ink)}
.sh{color:var(--ink)} .sh::before{content:'$ ';color:var(--green)}
.gap{display:block;height:8px}
.cursor{display:inline-block;width:8px;height:15px;background:var(--ink);vertical-align:-2px;margin-left:2px;opacity:.9}
</style>
</head>
<body>
<div class="win">
  <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="t" id="title"></span></div>
  <div class="body" id="body"></div>
</div>
<script src="../conversations/terms.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('t'); var T = window.TERMS[id]; if (!T) { document.body.textContent = 'unknown terminal: ' + id; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  function colour(out) { return esc(out).replace(/^(✓.*)$/gm, '<span class="ok">$1</span>').replace(/^(⚠.*|✗.*|OVERDUE.*)$/gm, '<span class="warn">$1</span>').replace(/^(#.*|##.*)$/gm, '<span class="h">$1</span>'); }
  document.getElementById('title').textContent = T.title; document.title = T.title;
  var files = {}; var need = []; T.lines.forEach(function (l) { if (l.file) need.push(l.file); });
  Promise.all(need.map(function (f) { return fetch('../conversations/' + f).then(function (r) { return r.text(); }).then(function (t) { files[f] = t; }); })).then(function () {
    var html = T.lines.map(function (l) {
      if (l.t === 'user') return '<span class="u">' + (l.slash ? '<span class="slash">' + esc(l.slash) + '</span> ' : '') + esc(l.text || '') + '</span>' + (l.hint ? '\n<span class="hint">' + esc(l.hint) + '</span>' : '');
      if (l.t === 'agent') return '<span class="a">' + esc(l.text) + '</span>';
      if (l.t === 'gap') return '<span class="gap"></span>';
      var out = l.out != null ? l.out : (l.file ? files[l.file] : '');
      if (l.lines) out = out.split('\n').slice(l.lines[0], l.lines[1]).join('\n');
      if (l.strip) out = out.split('\n').filter(function (x) { return x.indexOf('$ ') !== 0; }).join('\n');
      if (l.t === 'sh') return '<span class="sh">' + esc(l.cmd) + '</span>\n' + colour(out.replace(/\s+$/, '')) + '\n';
      if (l.t === 'tool') return '<span class="tool"><b>' + esc(l.tool || 'Bash') + '</b>(<span class="cmd">' + esc(l.cmd) + '</span>)</span>' + (out ? '<span class="out">' + colour(out.replace(/\s+$/, '')) + '</span>' : '');
      return '';
    }).join('\n');
    document.getElementById('body').innerHTML = html + (T.cursor === false ? '' : '\n<span class="u"></span><span class="cursor"></span>');
    document.title = 'ready';
  });
})();
</script>
</body>
</html>
